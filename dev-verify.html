<!doctype html>
<html><head><meta charset="utf-8"><title>verify</title>
<style>
body{margin:0;background:#222;color:#fff;font:10px monospace}
#row{display:flex;flex-wrap:wrap;gap:6px;padding:6px}
figure{margin:0}figcaption{padding:3px 0}
canvas{display:block;width:150px;height:180px;background:#fff}
</style>
</head><body>
<div id="row"></div>
<script type="module">
import * as THREE from 'three'
import { fullscreenVertexShader } from '/src/visuals/common.ts'
import { windFragmentShader } from '/src/visuals/windShader.ts'
import { slicesFragmentShader } from '/src/visuals/slicesShader.ts'
import { gridFragmentShader } from '/src/visuals/gridShader.ts'

const W = 400, H = 480, ASPECT = W / H
const quad = new THREE.PlaneGeometry(2, 2)
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1)

/** Renders a pure-fragment visual at a fixed progress, with no frame loop. */
function frag(label, shader, progress, time) {
  const fig = document.createElement('figure')
  const canvas = document.createElement('canvas')
  canvas.width = W; canvas.height = H
  const cap = document.createElement('figcaption')
  cap.textContent = label
  fig.append(canvas, cap)
  document.getElementById('row').append(fig)

  const gl = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false })
  gl.setPixelRatio(1); gl.setSize(W, H, false)
  const mat = new THREE.ShaderMaterial({
    vertexShader: fullscreenVertexShader,
    fragmentShader: shader,
    uniforms: {
      uResolution: { value: new THREE.Vector2(W, H) },
      uAspect: { value: ASPECT },
      uTime: { value: time },
      uProgress: { value: progress },
      uUrgency: { value: 1 - progress },
      uRunning: { value: 1 },
      uArmed: { value: 1 },
      uRemaining: { value: progress * 1800 },
      uFinish: { value: 0 },
    },
    depthTest: false, depthWrite: false,
  })
  const scene = new THREE.Scene(); scene.add(new THREE.Mesh(quad, mat))
  gl.render(scene, cam)
}

for (const p of [1.0, 0.75, 0.5, 0.25, 0.02]) frag('wind ' + p, windFragmentShader, p, 20)
for (const p of [1.0, 0.6, 0.25, 0.02]) frag('slices ' + p, slicesFragmentShader, p, 6)
for (const p of [1.0, 0.5, 0.02]) frag('grid ' + p, gridFragmentShader, p, 5)

document.title = 'verify done'
</script>
</body></html>
